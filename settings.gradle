pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'ArsBotania-Piercing-The-Heavens'

// Pure game rules, no Minecraft classes. Unit-tested on its own so the
// rules can be checked without starting the game.
include 'core'
// The NeoForge mod: registers items, config and events, delegating rules to core.
include 'mod'
