plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = "Jared's maven" // Ars Nouveau, Patchouli, JEI, GeckoLib mirror
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'Illusive Soulworks' // Curios
        url = 'https://maven.theillusivec4.top/'
    }
}

// The core rules compile straight into the mod jar.
sourceSets.main.java.srcDir project(':core').file('src/main/java')

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        // Headless look check: ./gradlew :mod:runVisualCheck -PvisualClass=sorcerer (see VisualCheck)
        visualCheck {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'arsbotania.visualCheck', project.findProperty('visualClass') ?: 'sorcerer'
            programArguments.addAll('--quickPlaySingleplayer', 'visualcheck')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    implementation("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:${ars_version}") {
        // Optional integrations Ars only uses when installed; their mavens are not needed here.
        exclude group: 'curse.maven'
        exclude group: 'mezz.jei'
        exclude group: 'com.github.glitchfiend' // TerraBlender
    }
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "vazkii.patchouli:Patchouli:${patchouli_version}"
    implementation files(rootProject.file("libs/${botania_jar}"))

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
